<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <!-- Bootstrap para Ícones dark/light -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- link para o css  -->
    <link rel="stylesheet" href="css/main.css">

</head>

<body>

    <!-- CABEÇALHO DA PÁGINA -->
    <header class="cabecalho">
        <div class="conteiner">
            <h1 class="logo">
                <i class="bi bi-book"></i> Biblioteca Digital
            </h1>

            <!-- ÁREA DE NAVEGAÇÃO E AÇÕES -->
            <nav class="navegacao">
                <button id="botaoTema" class="botao-tema" type="button" aria-label="Alternar modo de iluminação">
                    <i id="iconeTema" class="bi bi-sun"></i>
                    <span id="textoTema">Modo Claro</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (Apenas um <main> por página) -->
    <main class="conteudo-principal">

        <!-- SEÇÃO 1 da página -->
        <section class="secao_principal">
            <div class="conteiner">
                <h2>Sua Biblioteca Digital</h2>
                <p>Encontre, organize e acompanhe suas leituras favoritas em um só lugar.</p>
            </div>


            














        </section>


    </main>



    <!-- RODAPÉ DA PÁGINA -->
    <footer class="rodape">
        <div class="conteiner">
            <p>&copy; 2026 Biblioteca Digital. Desenvolvido para estudos.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
